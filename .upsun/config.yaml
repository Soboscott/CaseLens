applications:
  caselens:
    source:
      root: "/"
    type: "nodejs:24"
    build:
      flavor: none
    hooks:
      build: |
        set -eu
        npm ci --include=dev
        npm run build
    web:
      commands:
        start: sleep infinity
      locations:
        "/":
          root: "dist"
          index:
            - index.html
          scripts: false
          allow: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "caselens:http"
